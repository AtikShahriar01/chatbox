name: CI

# Quality gate: a failed lint, a failed build, or a failed offline test
# blocks the pipeline. Two jobs:
#   1. build-and-test (ubuntu): lint + build + the OFFLINE half of the §20
#      test pyramid (unit + parser, 64 checks).
#   2. security-live-windows: boots the app + agent-bridge on a WINDOWS
#      runner and runs the FULL suite (integration + security + e2e,
#      108 checks) — report-only for now (continue-on-error) while the
#      timing-sensitive suites settle in CI; flip to blocking once green.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install (clean lockfile install)
        run: npm ci --no-audit --no-fund

      - name: Lint (eslint, next/core-web-vitals)
        run: node node_modules/eslint/bin/eslint.js --max-warnings 200 --ext .js,.jsx app components lib middleware.js

      - name: Production build
        run: npx next build

      - name: §20 offline test pyramid (unit + parser; needs no server)
        working-directory: .
        run: node .selftest/run-all.mjs --offline

      - name: Dependency audit (report; known accepted risks are documented in docs/SECURITY_AUDIT.md)
        run: npm audit --audit-level=critical || true

  security-live-windows:
    runs-on: windows-latest
    continue-on-error: true # report-only until the live suites are CI-stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app deps
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Production build
        working-directory: app
        run: npx next build

      - name: Start agent-bridge (127.0.0.1:8765)
        working-directory: agent-bridge
        shell: bash
        run: node server.js & sleep 3

      - name: Start app (127.0.0.1:3000)
        working-directory: app
        shell: bash
        run: node node_modules/next/dist/bin/next start -H 127.0.0.1 -p 3000 & sleep 8

      - name: §20 FULL test pyramid (integration + security + e2e)
        working-directory: .
        shell: bash
        run: |
          curl -s -o /dev/null -w "bridge: %{http_code}\n" http://127.0.0.1:8765/status || true
          curl -s -o /dev/null -w "app:    %{http_code}\n" http://127.0.0.1:3000/login || true
          node .selftest/run-all.mjs
