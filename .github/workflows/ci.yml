name: CI

# Production-readiness gate (security directive §26): a failed build or a
# failed security test blocks the pipeline.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install (clean lockfile install)
        run: npm ci --no-audit --no-fund

      - name: Production build
        run: npx next build

      - name: §20 offline test pyramid (unit + parser; needs no server)
        working-directory: .
        run: node .selftest/run-all.mjs --offline

      - name: Dependency audit (report; known accepted risks are documented in docs/SECURITY_AUDIT.md)
        run: npm audit --audit-level=critical || true
