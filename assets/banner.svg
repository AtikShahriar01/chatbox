<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Chatbox — local-first AI chat, IDE and PC agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#141a3a"/>
      <stop offset="1" stop-color="#1b1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6feb"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#2f6feb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.75" r="0.6">
      <stop offset="0" stop-color="#9333ea" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow1)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow2)"/>
  <!-- logo mark -->
  <rect x="80" y="150" width="100" height="100" rx="26" fill="url(#accent)"/>
  <path d="M110 185 h40 a10 10 0 0 1 10 10 v20 a10 10 0 0 1 -10 10 h-22 l-16 14 v-14 a10 10 0 0 1 -12 -10 v-20 a10 10 0 0 1 10 -10 z" fill="#fff"/>
  <!-- title -->
  <text x="210" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff">Chatbox</text>
  <text x="214" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#aeb6d6">Local-first AI chat · built-in IDE · autonomous PC agent</text>
  <!-- tech chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="214" y="262" width="110" height="34" rx="17" fill="#ffffff14" stroke="#ffffff26"/>
    <text x="238" y="285" fill="#cdd6ff">Next.js</text>
    <rect x="334" y="262" width="90" height="34" rx="17" fill="#ffffff14" stroke="#ffffff26"/>
    <text x="356" y="285" fill="#cdd6ff">BYOK</text>
    <rect x="434" y="262" width="120" height="34" rx="17" fill="#ffffff14" stroke="#ffffff26"/>
    <text x="456" y="285" fill="#cdd6ff">Private</text>
    <rect x="564" y="262" width="150" height="34" rx="17" fill="#ffffff14" stroke="#ffffff26"/>
    <text x="586" y="285" fill="#cdd6ff">Multi-model</text>
    <rect x="724" y="262" width="130" height="34" rx="17" fill="#ffffff14" stroke="#ffffff26"/>
    <text x="746" y="285" fill="#cdd6ff">MIT License</text>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="24" fill="none" stroke="#ffffff22"/>
</svg>
