<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="26" viewBox="0 0 1200 26" role="img" aria-label="animated divider">
  <defs>
    <linearGradient id="dflow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6feb" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="11" width="1200" height="4" rx="2" fill="#ffffff" opacity="0.08"/>
  <rect x="-400" y="11" width="400" height="4" rx="2" fill="url(#dflow)">
    <animate attributeName="x" values="-400;1200" dur="4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="13" r="5" fill="#9333ea">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
